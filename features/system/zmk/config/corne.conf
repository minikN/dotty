CONFIG_ZMK_HID_INDICATORS=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

CONFIG_ZMK_DISPLAY=y
CONFIG_NICE_VIEW_WIDGET_INVERTED=y

