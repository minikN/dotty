# --- Wireless Corne (nice!nano v2 + nice!view) ---

# Drive the nice!view displays.
CONFIG_ZMK_DISPLAY=y

# Deep sleep after 30 min idle to save battery.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ZMK Studio is compiled in (enableZmkStudio). Leaving locking off lets Studio
# connect over USB out of the box. To keep it locked, drop this line and add a
# `&studio_unlock` binding to the keymap instead.
CONFIG_ZMK_STUDIO_LOCKING=n
